<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock Faces Widget</title>
<style>
:root{
  --bg-primary:#121212;--bg-surface:#1E1E1E;--text-primary:#FFFFFF;--text-secondary:#A0A0A0;
  --accent-blue:#3B82F6;--accent-green:#10B981;--accent-orange:#FF6B35;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:var(--sans)}
body{padding:8px;display:flex;justify-content:center}
#widget{width:100%;max-width:400px;background:var(--bg-surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:24px;margin:0;font-weight:600}
.btn{font:600 12px var(--sans);color:var(--text-primary);background:#2A2A2A;border:1px solid #333;border-radius:8px;padding:8px 10px;cursor:pointer;min-height:36px}
.btn:hover{border-color:#555}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{background:var(--accent-orange);border-color:var(--accent-orange);color:#111}
#control-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#control-bar .btn{padding:8px 4px}
#clock-display{position:relative;width:100%;aspect-ratio:4/3;container-type:inline-size;border-radius:8px;overflow:hidden;background:#0A0A0A}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--font);
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.face.active{opacity:1;visibility:visible;transition:opacity .3s ease}
.face svg{height:94%;width:auto;display:block}
.face text{font-family:var(--font);fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.hand{stroke-linecap:round}
/* E46 BMW-style analog face: black dial, orange (#FF6B35) illuminated numerals, ticks and needles */
#face-e46{--accent:#FF6B35;--fg:#FF6B35;--bg:#0A0A0A}
#face-e46 .e46-glow{filter:drop-shadow(0 0 2px var(--accent))}
#face-e46 .e46-tick{stroke:var(--fg)}
#face-e46 .e46-num{font-weight:700;font-size:17px}
#face-e46 .e46-label{font-size:8px;letter-spacing:2px;fill:var(--fg);opacity:.75}
#face-e46 .e46-lcd{fill:#140700;stroke:var(--accent);stroke-opacity:.5}
#face-e46 .e46-lcd-text{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--accent)}
#face-e46 .e46-needle{stroke:var(--accent)}
#face-e46 .e46-cap{fill:#1A1A1A;stroke:#444;stroke-width:2}
/* Classic */
#face-classic .c-tick{stroke:var(--fg)}
#face-classic .c-num{font-size:15px}
#face-classic .c-hand{stroke:var(--fg)}
#face-classic .c-sec{stroke:var(--accent)}
/* Minimal */
#face-minimal .m-dot{fill:var(--fg)}
#face-minimal .m-hand{stroke:var(--fg)}
#face-minimal .m-sec{stroke:var(--accent)}
/* LCD digital */
#face-lcd{font-family:var(--font)}
.lcd-panel{border:2px solid var(--accent);border-radius:8px;padding:4% 6%;text-align:center;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 40%,transparent) inset}
.lcd-main{font-size:18cqw;line-height:1;font-weight:700;letter-spacing:1px;text-shadow:0 0 6px var(--accent)}
.lcd-sec{font-size:8cqw;margin-left:2px;color:var(--accent)}
.lcd-row{display:flex;justify-content:space-between;gap:8px;font-size:5cqw;color:var(--accent);margin-top:4px}
/* Stacked digital */
.stack-num{font-size:24cqw;line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}
#stack-m{color:var(--accent)}
.stack-meta{font-size:4.5cqw;letter-spacing:3px;text-transform:uppercase;margin-top:3%;opacity:.8}
.stack-track{width:56%;height:4px;background:color-mix(in srgb,var(--fg) 15%,transparent);border-radius:2px;margin-top:3%;overflow:hidden}
#stack-bar{height:100%;width:0;background:var(--accent)}
#face-caption{font-size:12px;color:var(--text-secondary);text-align:center;margin:0}
#customize-panel{background:#171717;border:1px solid #2C2C2C;border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#customize-panel[hidden]{display:none}
#customize-panel h2{grid-column:1/-1;font-size:12px;margin:0;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-secondary)}
.field input[type=color]{width:100%;height:32px;border:1px solid #333;border-radius:4px;background:#222;padding:2px}
.field select{height:32px;border-radius:4px;border:1px solid #333;background:#222;color:var(--text-primary);font-size:12px;padding:0 6px}
.check{flex-direction:row;align-items:center;gap:8px}
#btn-reset{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){.face,.face.active{transition:none}}
</style>
</head>
<body>
<main id="widget" aria-label="Clock widget">
  <div class="top">
    <h1>Clock Faces</h1>
    <button class="btn" id="toggle-panel" type="button" aria-expanded="false" aria-controls="customize-panel">Customize</button>
  </div>

  <nav id="control-bar" aria-label="Clock face selector">
    <button class="btn face-btn" id="btn-e46" type="button" data-face="e46" aria-pressed="true" title="E46 BMW-style orange analog">E46</button>
    <button class="btn face-btn" id="btn-classic" type="button" data-face="classic" aria-pressed="false" title="Classic analog">Classic</button>
    <button class="btn face-btn" id="btn-minimal" type="button" data-face="minimal" aria-pressed="false" title="Minimal analog">Minimal</button>
    <button class="btn face-btn" id="btn-lcd" type="button" data-face="lcd" aria-pressed="false" title="LCD digital">LCD</button>
    <button class="btn face-btn" id="btn-stack" type="button" data-face="stack" aria-pressed="false" title="Stacked digital">Stack</button>
  </nav>

  <div id="clock-display" aria-live="off">
    <!-- Face 1: E46 BMW-style analog instrument-cluster clock, classic orange #FF6B35 -->
    <section class="face active" id="face-e46" data-face="e46" role="img" aria-label="E46 BMW-style analog clock with orange instrument-cluster glow">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="e46-bezel-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5A5A5A"/><stop offset=".5" stop-color="#1A1A1A"/><stop offset="1" stop-color="#3A3A3A"/>
          </linearGradient>
        </defs>
        <circle r="97" fill="url(#e46-bezel-grad)"/>
        <circle r="90" fill="var(--bg)"/>
        <g id="e46-ticks" class="e46-glow"></g>
        <text class="e46-label" y="-30">E46 · 1/MIN</text>
        <rect class="e46-lcd" x="-30" y="28" width="60" height="18" rx="3"/>
        <text id="e46-lcd-text" class="e46-lcd-text" y="37">00:00</text>
        <g class="e46-glow">
          <line id="e46-hour" class="hand e46-needle" x1="0" y1="10" x2="0" y2="-46" stroke-width="6"/>
          <line id="e46-min" class="hand e46-needle" x1="0" y1="12" x2="0" y2="-70" stroke-width="4"/>
          <line id="e46-sec" class="hand e46-needle" x1="0" y1="16" x2="0" y2="-80" stroke-width="1.5"/>
        </g>
        <circle class="e46-cap" r="7"/>
      </svg>
    </section>

    <!-- Face 2: Classic analog -->
    <section class="face" id="face-classic" data-face="classic" role="img" aria-label="Classic analog clock">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <circle r="94" fill="var(--bg)" stroke="var(--fg)" stroke-width="4"/>
        <g id="classic-ticks"></g>
        <line id="classic-hour" class="hand c-hand" x1="0" y1="8" x2="0" y2="-45" stroke-width="7"/>
        <line id="classic-min" class="hand c-hand" x1="0" y1="10" x2="0" y2="-70" stroke-width="4"/>
        <line id="classic-sec" class="hand c-sec" x1="0" y1="18" x2="0" y2="-78" stroke-width="1.5"/>
        <circle r="4" fill="var(--accent)"/>
      </svg>
    </section>

    <!-- Face 3: Minimal analog -->
    <section class="face" id="face-minimal" data-face="minimal" role="img" aria-label="Minimal analog clock">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <g id="minimal-ticks"></g>
        <line id="minimal-hour" class="hand m-hand" x1="0" y1="0" x2="0" y2="-44" stroke-width="5"/>
        <line id="minimal-min" class="hand m-hand" x1="0" y1="0" x2="0" y2="-68" stroke-width="3"/>
        <line id="minimal-sec" class="hand m-sec" x1="0" y1="0" x2="0" y2="-76" stroke-width="1.5"/>
        <circle r="3" fill="var(--accent)"/>
      </svg>
    </section>

    <!-- Face 4: LCD digital -->
    <section class="face" id="face-lcd" data-face="lcd" role="img" aria-label="LCD digital clock">
      <div class="lcd-panel">
        <div><span id="lcd-time" class="lcd-main">00:00</span><span id="lcd-sec" class="lcd-sec">00</span></div>
        <div class="lcd-row"><span id="lcd-date">---</span><span id="lcd-ampm">AM</span></div>
      </div>
    </section>

    <!-- Face 5: Stacked digital -->
    <section class="face" id="face-stack" data-face="stack" role="img" aria-label="Stacked digital clock">
      <div id="stack-h" class="stack-num">00</div>
      <div id="stack-m" class="stack-num">00</div>
      <div class="stack-track"><div id="stack-bar"></div></div>
      <div id="stack-day" class="stack-meta">---</div>
    </section>
  </div>

  <p id="face-caption">E46 — BMW-style orange analog</p>

  <section id="customize-panel" hidden aria-label="Customize colors and fonts">
    <h2 id="panel-title">Customizing: E46</h2>
    <label class="field">Accent / hands<input type="color" id="in-accent" value="#FF6B35"></label>
    <label class="field">Numerals / text<input type="color" id="in-fg" value="#FF6B35"></label>
    <label class="field">Background<input type="color" id="in-bg" value="#0A0A0A"></label>
    <label class="field">Font
      <select id="in-font">
        <option value="sans">System Sans</option>
        <option value="condensed">Condensed</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
        <option value="rounded">Humanist</option>
      </select>
    </label>
    <label class="field check"><input type="checkbox" id="in-24h"> 24-hour time</label>
    <button class="btn" id="btn-reset" type="button">Reset this face</button>
  </section>
</main>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var KEY = 'clockWidget.v1';
  var FACES = ['e46', 'classic', 'minimal', 'lcd', 'stack'];
  var CAPTIONS = {
    e46: 'E46 — BMW-style orange analog',
    classic: 'Classic — serif analog dial',
    minimal: 'Minimal — dots-only analog',
    lcd: 'LCD — digital with seconds and date',
    stack: 'Stack — stacked digital hours and minutes'
  };
  var NAMES = { e46: 'E46', classic: 'Classic', minimal: 'Minimal', lcd: 'LCD', stack: 'Stack' };
  var FONTS = {
    sans: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
    condensed: "'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif",
    serif: "Georgia, 'Times New Roman', serif",
    mono: "'Courier New', monospace",
    rounded: "'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
  };
  // E46 default accent is the classic BMW cluster orange #FF6B35
  var DEFAULTS = {
    e46: { accent: '#FF6B35', fg: '#FF6B35', bg: '#0A0A0A', font: 'condensed' },
    classic: { accent: '#3B82F6', fg: '#1E1E1E', bg: '#F5F5F0', font: 'serif' },
    minimal: { accent: '#10B981', fg: '#FFFFFF', bg: '#1E1E1E', font: 'sans' },
    lcd: { accent: '#10B981', fg: '#9EF0C4', bg: '#0F1A14', font: 'mono' },
    stack: { accent: '#3B82F6', fg: '#FFFFFF', bg: '#121212', font: 'sans' }
  };
  var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  var state = { face: 'e46', h24: false, custom: {} };

  function $(id) { return document.getElementById(id); }
  function isHex(v) { return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v); }

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && FACES.indexOf(s.face) !== -1) state.face = s.face;
      if (s && typeof s.h24 === 'boolean') state.h24 = s.h24;
      if (s && s.custom && typeof s.custom === 'object') state.custom = s.custom;
    } catch (e) { /* storage blocked or corrupt: keep defaults */ }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked */ }
  }

  function settingsFor(f) {
    var d = DEFAULTS[f], c = state.custom[f] || {};
    return {
      accent: isHex(c.accent) ? c.accent : d.accent,
      fg: isHex(c.fg) ? c.fg : d.fg,
      bg: isHex(c.bg) ? c.bg : d.bg,
      font: FONTS[c.font] ? c.font : d.font
    };
  }
  function applyFace(f) {
    var s = settingsFor(f), el = $('face-' + f);
    el.style.setProperty('--accent', s.accent);
    el.style.setProperty('--fg', s.fg);
    el.style.setProperty('--bg', s.bg);
    el.style.setProperty('--font', FONTS[s.font]);
  }

  function svg(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  }
  function polar(r, deg) {
    var a = deg * Math.PI / 180;
    return { x: (r * Math.sin(a)).toFixed(2), y: (-r * Math.cos(a)).toFixed(2) };
  }
  function buildDial(groupId, o) {
    var g = $(groupId);
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0, deg = i * 6;
      if (o.dots) {
        if (!major) continue;
        var p = polar(84, deg);
        svg('circle', { cx: p.x, cy: p.y, r: i % 15 === 0 ? 5 : 2.5, 'class': o.cls }, g);
        continue;
      }
      var a = polar(o.outer, deg), b = polar(major ? o.outer - o.major : o.outer - o.minor, deg);
      svg('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, 'class': o.cls, 'stroke-width': major ? o.majorW : o.minorW }, g);
      if (major && o.numCls) {
        var n = i / 5 || 12, t = polar(o.numR, deg);
        svg('text', { x: t.x, y: t.y, 'class': o.numCls }, g).textContent = String(n);
      }
    }
  }

  function rot(id, deg) { $(id).setAttribute('transform', 'rotate(' + deg.toFixed(2) + ')'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hourStr(h) { return state.h24 ? pad(h) : pad(h % 12 || 12); }

  var timer = null;
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    var sDeg = s * 6, mDeg = (m + s / 60) * 6, hDeg = ((h % 12) + m / 60) * 30;
    ['e46', 'classic', 'minimal'].forEach(function (p) {
      rot(p + '-hour', hDeg); rot(p + '-min', mDeg); rot(p + '-sec', sDeg);
    });
    var hm = hourStr(h) + ':' + pad(m);
    $('e46-lcd-text').textContent = hm;
    $('lcd-time').textContent = hm;
    $('lcd-sec').textContent = pad(s);
    $('lcd-ampm').textContent = state.h24 ? '24H' : (h < 12 ? 'AM' : 'PM');
    $('lcd-date').textContent = DAYS[d.getDay()] + ' ' + pad(d.getDate()) + ' ' + MONTHS[d.getMonth()];
    $('stack-h').textContent = hourStr(h);
    $('stack-m').textContent = pad(m);
    $('stack-bar').style.width = (s / 59 * 100).toFixed(1) + '%';
    $('stack-day').textContent = DAYS[d.getDay()] + ' · ' + pad(d.getDate()) + ' ' + MONTHS[d.getMonth()] + (state.h24 ? '' : (h < 12 ? ' · AM' : ' · PM'));
    clearTimeout(timer);
    timer = setTimeout(tick, 1000 - d.getMilliseconds() + 10);
  }

  function syncPanel() {
    var s = settingsFor(state.face);
    $('panel-title').textContent = 'Customizing: ' + NAMES[state.face];
    $('in-accent').value = s.accent;
    $('in-fg').value = s.fg;
    $('in-bg').value = s.bg;
    $('in-font').value = s.font;
    $('in-24h').checked = state.h24;
  }

  function setFace(f) {
    if (FACES.indexOf(f) === -1) return;
    state.face = f;
    FACES.forEach(function (x) {
      $('face-' + x).classList.toggle('active', x === f);
      $('btn-' + x).setAttribute('aria-pressed', x === f ? 'true' : 'false');
    });
    $('face-caption').textContent = CAPTIONS[f];
    syncPanel();
    save();
  }

  function onCustom(key, value) {
    var c = state.custom[state.face] || (state.custom[state.face] = {});
    c[key] = value;
    applyFace(state.face);
    save();
  }

  // Build dials
  buildDial('e46-ticks', { outer: 86, major: 12, minor: 5, majorW: 3.5, minorW: 1.2, cls: 'e46-tick', numCls: 'e46-num', numR: 62 });
  buildDial('classic-ticks', { outer: 88, major: 10, minor: 4, majorW: 3, minorW: 1, cls: 'c-tick', numCls: 'c-num', numR: 66 });
  buildDial('minimal-ticks', { dots: true, cls: 'm-dot' });

  // Wire controls
  Array.prototype.forEach.call(document.querySelectorAll('.face-btn'), function (b) {
    b.addEventListener('click', function () { setFace(b.getAttribute('data-face')); });
  });
  $('toggle-panel').addEventListener('click', function () {
    var p = $('customize-panel'), open = p.hasAttribute('hidden');
    if (open) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  $('in-accent').addEventListener('input', function () { onCustom('accent', this.value); });
  $('in-fg').addEventListener('input', function () { onCustom('fg', this.value); });
  $('in-bg').addEventListener('input', function () { onCustom('bg', this.value); });
  $('in-font').addEventListener('change', function () { onCustom('font', this.value); });
  $('in-24h').addEventListener('change', function () { state.h24 = this.checked; save(); tick(); });
  $('btn-reset').addEventListener('click', function () {
    delete state.custom[state.face];
    applyFace(state.face); syncPanel(); save();
  });

  load();
  FACES.forEach(applyFace);
  setFace(state.face);
  tick();
})();
</script>
</body>
</html>
